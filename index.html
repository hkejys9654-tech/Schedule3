<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>광주봉선교회 교구전도인 심방일정표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --bg:#EEF4FB;
  --card:#FFFFFF;
  --sky:#3E8ED0;
  --sky-2:#5AA9E6;
  --sky-deep:#2A6FB5;
  --sky-soft:#E9F3FD;
  --sky-line:#CFE4F7;
  --navy:#1E3A5F;
  --ink:#1F2D3D;
  --muted:#94A3B8;
  --line:#E4EBF3;
  --coral:#DD6B6B;
  --coral-soft:#FCEDED;
  --coral-line:#F3D4D4;
  --shadow:0 20px 50px rgba(30,58,95,.12);
  --shadow-sm:0 6px 18px rgba(30,58,95,.07);
  --sans:"Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{
  background:
    radial-gradient(1000px 500px at 85% -8%, #DCEBFB 0%, transparent 55%),
    radial-gradient(800px 440px at -5% 102%, #E4EFFB 0%, transparent 50%),
    var(--bg);
  font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;
}
body{max-width:460px;margin:0 auto;padding:22px 16px 40px;min-height:100vh}
button,input{font-family:inherit}

/* ===== HEADER ===== */
.head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.crest{
  width:46px;height:46px;border-radius:14px;
  background:linear-gradient(145deg,var(--sky-2),var(--sky-deep));
  display:grid;place-items:center;position:relative;
  box-shadow:0 8px 20px rgba(62,142,208,.32);
}
.crest::before,.crest::after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:2px}
.crest::before{width:3px;height:18px;transform:translate(-50%,-50%)}
.crest::after{width:12px;height:3px;transform:translate(-50%,-50%) translateY(-4px)}
.head .ttl strong{display:block;font-weight:800;font-size:17px;letter-spacing:-.02em;line-height:1.2}
.head .ttl span{font-size:10px;letter-spacing:.3em;color:var(--sky);font-weight:700}

/* ===== HERO ===== */
.hero{
  background:linear-gradient(155deg,var(--sky-2) 0%,var(--sky) 55%,var(--sky-deep) 100%);
  border-radius:28px;padding:26px 24px 24px;box-shadow:0 22px 48px rgba(42,111,181,.3);
  position:relative;overflow:hidden;color:#fff;
}
.hero::before{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero::after{content:"";position:absolute;right:30px;bottom:-30px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.1)}
.kicker{font-size:11px;letter-spacing:.3em;font-weight:700;color:rgba(255,255,255,.78);margin-bottom:10px}
h1{font-weight:800;font-size:30px;line-height:1.2;letter-spacing:-.03em}

.month{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:8px;margin-top:22px}
.nav{
  height:46px;border:none;border-radius:14px;background:rgba(255,255,255,.16);
  color:#fff;font-size:22px;line-height:1;transition:.15s;
}
.nav:active{background:rgba(255,255,255,.3);transform:scale(.95)}
.monthTitle{text-align:center}
.monthTitle small{display:block;color:rgba(255,255,255,.7);font-weight:600;font-size:13px;letter-spacing:.04em}
.monthTitle b{font-weight:800;font-size:36px;letter-spacing:-.03em;line-height:1.1}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.stat{background:rgba(255,255,255,.16);border-radius:15px;padding:13px 6px;text-align:center}
.stat b{display:block;font-size:25px;font-weight:800;line-height:1}
.stat span{font-size:11px;color:rgba(255,255,255,.82);font-weight:600;margin-top:6px;display:block}

/* ===== ACTIONS ===== */
.actions{display:grid;grid-template-columns:1.6fr 1fr;gap:10px;margin:16px 0 14px}
.btn{
  border:none;border-radius:17px;padding:16px 10px;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .14s,box-shadow .14s;
}
.btn:active{transform:translateY(1px) scale(.99)}
.btn .bi{width:18px;height:18px;display:inline-block}
.btn-primary{
  background:linear-gradient(135deg,var(--sky-2),var(--sky-deep));color:#fff;
  box-shadow:0 12px 26px rgba(42,111,181,.34);
}
.btn-ghost{background:var(--card);color:var(--sky-deep);box-shadow:var(--shadow-sm), inset 0 0 0 1px var(--line)}

/* ===== LEGEND ===== */
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:0 0 14px}
.leg{
  border-radius:13px;padding:10px 4px;font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:var(--card);box-shadow:inset 0 0 0 1px var(--line);
}
.leg .dot{width:8px;height:8px;border-radius:50%}
.leg.g{color:var(--muted)}.leg.g .dot{background:#C3CDD9}
.leg.r{color:var(--coral);background:var(--coral-soft);box-shadow:inset 0 0 0 1px var(--coral-line)}.leg.r .dot{background:var(--coral)}
.leg.c{color:var(--sky-deep);background:var(--sky-soft);box-shadow:inset 0 0 0 1px var(--sky-line)}.leg.c .dot{background:var(--sky)}

.hint{text-align:center;color:var(--muted);font-weight:500;font-size:12.5px;margin:0 0 14px}

/* ===== TABLE ===== */
.tableWrap{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow-sm), inset 0 0 0 1px var(--line)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{
  background:linear-gradient(135deg,var(--sky),var(--sky-deep));color:#fff;
  padding:13px 2px;font-size:12px;font-weight:700;
}
thead th small{display:block;color:rgba(255,255,255,.8);margin-top:3px;font-size:10px;font-weight:500}
.colDate{width:46px}.colDay{width:40px}
tbody td{border-bottom:1px solid #EEF2F7;text-align:center;height:54px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
.wkRow td{background:#F7FAFD}
.cDate{font-size:15px;font-weight:700;color:var(--ink);line-height:1.1}
.cDate .dnum{font-size:15px;font-weight:700}
.cDate .hol{font-size:9px;font-weight:700;color:var(--coral);margin-top:2px;letter-spacing:-.02em}
.cDate.isHol .dnum{color:var(--coral)}
.cDay{font-size:14px;font-weight:700}
.sun{color:var(--coral)}.sat{color:var(--sky)}

.slot{cursor:pointer;user-select:none;padding:5px 4px}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:11px;padding:7px 3px;min-height:40px;transition:transform .12s}
.slot:active .chip{transform:scale(.94)}
.chip .ic{font-size:13px;line-height:1;font-weight:700}
.chip .tx{font-size:10.5px;font-weight:600;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.available .chip{background:transparent;color:#AEB9C7}
.available .chip .ic{color:#C7D1DD}
.unavailable .chip{background:var(--coral-soft);color:var(--coral);box-shadow:inset 0 0 0 1px var(--coral-line)}
.confirmed .chip{background:var(--sky-soft);color:var(--sky-deep);box-shadow:inset 0 0 0 1px var(--sky-line)}
.confirmed .chip .ic{color:var(--sky)}

.foot{
  text-align:center;color:#64748B;font-size:12px;font-weight:600;line-height:1.7;
  margin:18px 4px 6px;background:var(--card);border-radius:16px;padding:15px 18px;
  box-shadow:inset 0 0 0 1px var(--line);
}
.foot b{color:var(--sky-deep);font-weight:700}

/* ===== MODAL ===== */
.modal{position:fixed;inset:0;background:rgba(20,40,65,.45);display:none;align-items:flex-end;z-index:50;backdrop-filter:blur(3px)}
.modal.show{display:flex}
.sheet{
  width:100%;max-width:460px;margin:0 auto;background:var(--card);
  border-radius:28px 28px 0 0;padding:16px 20px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 -12px 44px rgba(20,40,65,.2);animation:rise .26s cubic-bezier(.2,.8,.25,1);
}
@keyframes rise{from{transform:translateY(46px);opacity:.5}to{transform:translateY(0);opacity:1}}
.handle{width:40px;height:4px;background:var(--line);border-radius:10px;margin:0 auto 16px}
.sheet h2{text-align:center;font-weight:800;font-size:20px;letter-spacing:-.02em}
.sheet p{text-align:center;margin:5px 0 16px;color:var(--sky);font-weight:700;font-size:13px;letter-spacing:.03em}
.stateGrid{display:grid;gap:9px}
.state{
  border:none;border-radius:15px;background:#F4F8FC;padding:15px 16px;text-align:left;
  font-weight:700;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:11px;
  box-shadow:inset 0 0 0 1.5px var(--line);transition:.15s;
}
.state .sdot{width:11px;height:11px;border-radius:50%;flex:none}
.state[data-state="available"] .sdot{background:#C3CDD9}
.state[data-state="unavailable"] .sdot{background:var(--coral)}
.state[data-state="confirmed"] .sdot{background:var(--sky)}
.state.active[data-state="available"]{background:#fff;box-shadow:inset 0 0 0 2px var(--muted)}
.state.active[data-state="unavailable"]{background:var(--coral-soft);color:var(--coral);box-shadow:inset 0 0 0 2px var(--coral)}
.state.active[data-state="confirmed"]{background:var(--sky-soft);color:var(--sky-deep);box-shadow:inset 0 0 0 2px var(--sky)}
.inputBox{margin-top:14px;display:none}
.inputBox.show{display:block}
.inputBox label{font-weight:700;font-size:12.5px;color:var(--muted)}
.inputBox input{width:100%;margin-top:8px;border:none;background:#F4F8FC;border-radius:14px;padding:15px;font-size:16px;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.inputBox input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--sky)}
.sheetBtns{display:grid;grid-template-columns:1fr 1.8fr;gap:10px;margin-top:18px}
.cancel,.ok{border:none;border-radius:16px;padding:15px;font-weight:700;font-size:15px;transition:transform .14s}
.cancel:active,.ok:active{transform:scale(.98)}
.cancel{background:#EEF2F7;color:var(--ink)}
.ok{background:linear-gradient(135deg,var(--sky-2),var(--sky-deep));color:#fff;box-shadow:0 10px 22px rgba(42,111,181,.3)}

.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(8px);background:var(--navy);color:#fff;border-radius:999px;padding:11px 20px;font-weight:700;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 12px 30px rgba(20,40,65,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.preview{position:fixed;inset:0;background:rgba(18,32,50,.92);z-index:80;display:none;flex-direction:column;padding:20px;backdrop-filter:blur(4px)}
.preview.show{display:flex}
.preview .close{align-self:flex-end;background:rgba(255,255,255,.96);border:none;border-radius:999px;width:46px;height:46px;position:relative;font-size:0;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.preview .close::before,.preview .close::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:2.4px;background:var(--ink);border-radius:3px}
.preview .close::before{transform:translate(-50%,-50%) rotate(45deg)}
.preview .close::after{transform:translate(-50%,-50%) rotate(-45deg)}
.preview img{max-width:100%;max-height:72vh;height:auto;border-radius:16px;background:#fff;margin:auto;display:block;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.preview .pvBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.preview a,.preview button{text-align:center;text-decoration:none;border:none;border-radius:15px;padding:15px;font-weight:700;font-size:15px}
.preview .pvSave{background:linear-gradient(135deg,var(--sky-2),var(--sky-deep));color:#fff}
.preview button:not(.pvSave):not(.close){background:rgba(255,255,255,.96);color:var(--ink)}
.preview .pvGuide{text-align:center;color:#fff;font-size:15px;font-weight:700;line-height:1.5;margin-bottom:14px;background:rgba(62,142,208,.9);border-radius:16px;padding:14px 16px}
.preview .pvGuide b{color:#FFE08A}
</style>
</head>
<body>

<div class="head">
  <div class="crest"></div>
  <div class="ttl"><strong>광주봉선교회</strong><span>PASTORAL VISIT</span></div>
</div>

<section class="hero">
  <div class="kicker">SCHEDULE</div>
  <h1>교구전도인 심방일정표</h1>
  <div class="month">
    <button class="nav" onclick="moveMonth(-1)">‹</button>
    <div class="monthTitle"><small id="yearTxt"></small><b id="monthTxt"></b></div>
    <button class="nav" onclick="moveMonth(1)">›</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="cntC">0</b><span>예약완료</span></div>
    <div class="stat"><b id="cntR">0</b><span>불가능</span></div>
    <div class="stat"><b id="cntA">0</b><span>가능</span></div>
  </div>
</section>

<div class="actions">
  <button class="btn btn-primary" onclick="exportAsk()">
    <svg class="bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
    이미지로 저장
  </button>
  <button class="btn btn-ghost" onclick="resetMonth()">
    <svg class="bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/></svg>
    초기화
  </button>
</div>

<div class="legend">
  <div class="leg g"><span class="dot"></span>가능</div>
  <div class="leg r"><span class="dot"></span>불가능</div>
  <div class="leg c"><span class="dot"></span>예약완료</div>
</div>

<div class="hint">날짜 칸을 누르면 일정을 바로 수정할 수 있습니다</div>

<div class="tableWrap">
<table>
  <thead>
    <tr>
      <th class="colDate">날짜</th>
      <th class="colDay">요일</th>
      <th>오전<small>10:00</small></th>
      <th>오후<small>14:00</small></th>
      <th>저녁<small>19:00</small></th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

<div class="foot">변경사항은 이 기기에 <b>자동 저장</b>됩니다.<br>휴대폰에 열어두면 어디서든 월별 심방 가능 시간을 확인할 수 있습니다.</div>

<div class="modal" id="modal" onclick="backdropClose(event)">
  <div class="sheet">
    <div class="handle"></div>
    <h2 id="modalTitle">일정 수정</h2>
    <p id="modalSub">시간 선택</p>
    <div class="stateGrid">
      <button class="state" data-state="available" onclick="pickState('available')"><span class="sdot"></span>가능합니다</button>
      <button class="state" data-state="unavailable" onclick="pickState('unavailable')"><span class="sdot"></span>불가능합니다</button>
      <button class="state" data-state="confirmed" onclick="pickState('confirmed')"><span class="sdot"></span>예약 완료</button>
    </div>
    <div class="inputBox" id="memoBox">
      <label id="memoLabel">예약자 이름 또는 사유</label>
      <input id="memoInput" placeholder="예: 김철수 집사님 / 회의 / 사역" />
    </div>
    <div class="sheetBtns">
      <button class="cancel" onclick="closeModal()">닫기</button>
      <button class="ok" onclick="saveSlot()">저장하기</button>
    </div>
  </div>
</div>

<div class="modal" id="exportModal" onclick="closeExport(event)">
  <div class="sheet">
    <div class="handle"></div>
    <h2>이미지 저장 형식</h2>
    <p>카톡 공유용 이미지를 만듭니다</p>
    <div class="stateGrid">
      <button class="state" onclick="makeImage('table')"><span class="sdot" style="background:var(--sky)"></span>표 형태로 만들기</button>
      <button class="state" onclick="makeImage('calendar')"><span class="sdot" style="background:var(--sky-deep)"></span>달력 형태로 만들기</button>
    </div>
    <div class="sheetBtns" style="grid-template-columns:1fr">
      <button class="cancel" onclick="hideExport()">취소</button>
    </div>
  </div>
</div>

<div class="modal" id="resetModal" onclick="closeReset(event)">
  <div class="sheet">
    <div class="handle"></div>
    <h2>이번 달 초기화</h2>
    <p id="resetSub">모든 일정이 삭제됩니다</p>
    <div class="sheetBtns">
      <button class="cancel" onclick="hideReset()">취소</button>
      <button class="ok" onclick="doReset()" style="background:linear-gradient(135deg,#E58A8A,#D45F5F);box-shadow:0 10px 22px rgba(212,95,95,.3)">초기화</button>
    </div>
  </div>
</div>

<div class="preview" id="preview">
  <button class="close" onclick="hidePreview()"></button>
  <img id="previewImg" />
  <div class="pvBtns">
    <button class="pvSave" onclick="saveImage()">이미지 저장</button>
    <button onclick="hidePreview()">닫기</button>
  </div>
  <a id="downloadLink" download="심방일정.png" style="display:none"></a>
</div>

<div class="toast" id="toast"></div>

<script>
const W=['일','월','화','수','목','금','토'];
const SLOTS=['morning','afternoon','evening'];
const SLOTNAME={morning:'오전 10:00',afternoon:'오후 14:00',evening:'저녁 19:00'};
let now=new Date(),Y=now.getFullYear(),M=now.getMonth()+1;
let data={}, editing=null, selected='available', lastBlob=null;

const PAL={
  bg:'#EEF4FB', card:'#FFFFFF', sky:'#3E8ED0', sky2:'#5AA9E6', skyDeep:'#2A6FB5',
  skySoft:'#E9F3FD', skyLine:'#CFE4F7', navy:'#1E3A5F', ink:'#1F2D3D', muted:'#94A3B8',
  line:'#E4EBF3', coral:'#DD6B6B', coralSoft:'#FCEDED', coralLine:'#F3D4D4',
  sun:'#DD6B6B', sat:'#3E8ED0'
};

function key(){return 'bongsun_visit_'+Y+'_'+String(M).padStart(2,'0')}
function dateKey(d){return Y+'-'+String(M).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function holiday(yy,mm,dd){
  const md=String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
  const fixed={'01-01':'신정','03-01':'삼일절','05-05':'어린이날','06-06':'현충일','08-15':'광복절','10-03':'개천절','10-09':'한글날','12-25':'성탄절'};
  if(fixed[md])return fixed[md];
  if(yy===2026){
    const y26={'02-16':'설날','02-17':'설날','02-18':'설날','03-02':'대체','05-24':'석탄일','05-25':'대체','08-17':'대체','09-24':'추석','09-25':'추석','09-26':'추석','10-05':'대체'};
    if(y26[md])return y26[md];
  }
  return null;
}
function load(){try{data=JSON.parse(localStorage.getItem(key())||'{}')}catch(e){data={}}}
function save(){try{localStorage.setItem(key(),JSON.stringify(data))}catch(e){}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1600)}

function render(){
  load();
  document.getElementById('yearTxt').textContent=Y+'년';
  document.getElementById('monthTxt').textContent=M+'월';
  const last=new Date(Y,M,0).getDate();
  const tbody=document.getElementById('tbody');tbody.innerHTML='';
  let ca=0,cr=0,cc=0;
  for(let d=1;d<=last;d++){
    const wd=new Date(Y,M-1,d).getDay(), dk=dateKey(d);
    const tr=document.createElement('tr');
    if(wd===0||wd===6)tr.className='wkRow';
    const hol=holiday(Y,M,d), isRed=(wd===0||hol);
    tr.innerHTML='<td class="cDate'+(isRed?' isHol':'')+'"><div class="dnum">'+d+'</div>'+(hol?'<div class="hol">'+hol+'</div>':'')+'</td><td class="cDay '+(isRed?'sun':wd==6?'sat':'')+'">'+W[wd]+'</td>';
    SLOTS.forEach(slot=>{
      const item=(data[dk]&&data[dk][slot])||{state:'available',memo:''};
      if(item.state==='available')ca++; if(item.state==='unavailable')cr++; if(item.state==='confirmed')cc++;
      const td=document.createElement('td');
      td.className='slot '+item.state;
      td.innerHTML='<div class="chip"><span class="ic">'+icon(item.state)+'</span><span class="tx">'+label(item)+'</span></div>';
      td.onclick=()=>openSlot(d,slot);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  cntA.textContent=ca;cntR.textContent=cr;cntC.textContent=cc;
}
function icon(s){return s==='available'?'○':s==='unavailable'?'×':'✓'}
function label(item){
  if(item.state==='available')return '가능';
  if(item.state==='unavailable')return item.memo||'불가';
  return item.memo||'예약';
}
function moveMonth(n){M+=n;if(M<1){M=12;Y--}if(M>12){M=1;Y++}render()}
function resetMonth(){
  var sub=document.getElementById('resetSub');
  if(sub)sub.textContent=Y+'년 '+M+'월 일정이 모두 삭제됩니다';
  var m=document.getElementById('resetModal');
  if(m)m.classList.add('show');
}
function hideReset(){var m=document.getElementById('resetModal');if(m)m.classList.remove('show')}
function closeReset(e){if(e.target.id==='resetModal')hideReset()}
function doReset(){data={};save();render();hideReset();toast('초기화되었습니다')}
function openSlot(d,slot){
  const dk=dateKey(d), item=(data[dk]&&data[dk][slot])||{state:'available',memo:''};
  editing={d,slot,dk}; selected=item.state;
  modalTitle.textContent=M+'월 '+d+'일 ('+W[new Date(Y,M-1,d).getDay()]+')';
  modalSub.textContent=SLOTNAME[slot];
  memoInput.value=item.memo||'';
  updateState();
  modal.classList.add('show');
}
function pickState(s){selected=s;updateState()}
function updateState(){
  document.querySelectorAll('.state[data-state]').forEach(b=>b.classList.toggle('active',b.dataset.state===selected));
  memoBox.classList.toggle('show',selected!=='available');
  memoLabel.textContent=selected==='confirmed'?'예약자 이름':'불가능 사유';
  memoInput.placeholder=selected==='confirmed'?'예: 김철수 집사님':'예: 회의 / 사역 / 주일예배';
}
function saveSlot(){
  if(!editing)return;
  if(!data[editing.dk])data[editing.dk]={};
  if(selected==='available'){delete data[editing.dk][editing.slot]}
  else data[editing.dk][editing.slot]={state:selected,memo:memoInput.value.trim()};
  if(Object.keys(data[editing.dk]).length===0)delete data[editing.dk];
  save();closeModal();render();toast('저장되었습니다');
}
function closeModal(){modal.classList.remove('show');editing=null}
function backdropClose(e){if(e.target.id==='modal')closeModal()}
function exportAsk(){exportModal.classList.add('show')}
function hideExport(){exportModal.classList.remove('show')}
function closeExport(e){if(e.target.id==='exportModal')hideExport()}

function makeImage(type){
  hideExport();
  try{
    const canvas=type==='calendar'?drawCalendar():drawTable();
    if(!canvas){toast('이미지 생성 실패');return}
    const url=canvas.toDataURL('image/png');
    canvas.toBlob(b=>{lastBlob=b},'image/png');
    previewImg.src=url;
    downloadLink.href=url;
    downloadLink.download='광주봉선교회_심방일정_'+Y+'년_'+M+'월.png';
    preview.classList.add('show');
  }catch(e){console.error('makeImage 오류:',e);toast('이미지 생성에 실패했습니다')}
}
function hidePreview(){preview.classList.remove('show')}
function dataURLtoBlob(d){
  try{
    const a=d.split(','),m=a[0].match(/:(.*?);/)[1],b=atob(a[1]);let n=b.length;const u=new Uint8Array(n);
    while(n--)u[n]=b.charCodeAt(n);return new Blob([u],{type:m});
  }catch(e){return null}
}
function saveImage(){
  let blob=lastBlob;
  if(!blob&&previewImg.src)blob=dataURLtoBlob(previewImg.src);
  if(!blob){toast('이미지 생성 실패');return}
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='광주봉선교회_심방일정_'+Y+'년_'+M+'월.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(e){
    if(navigator.canShare){
      try{
        const f=new File([blob],'광주봉선교회_심방일정.png',{type:'image/png'});
        if(navigator.canShare({files:[f]})){navigator.share({files:[f]});return}
      }catch(_){}
    }
    toast('이미지를 길게 눌러 저장하세요');
  }
}
async function nativeShare(){
  let blob=lastBlob;
  if(!blob&&previewImg.src)blob=dataURLtoBlob(previewImg.src);
  if(blob&&navigator.canShare){
    try{
      const f=new File([blob],'광주봉선교회_심방일정.png',{type:'image/png'});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
    }catch(e){if(e&&e.name==='AbortError')return}
  }
  toast('위 이미지를 길게 눌러 저장하세요');
}

/* ===================== CANVAS ===================== */
function round(ctx,x,y,w,h,r,fill,stroke,lw){
  if(r>Math.min(w,h)/2)r=Math.min(w,h)/2;
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke()}
}
function drawHeader(ctx,w){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,w,9999);
  // 스카이블루 그라데이션 헤더
  const g=ctx.createLinearGradient(0,0,w,108);
  g.addColorStop(0,PAL.sky2);g.addColorStop(1,PAL.skyDeep);
  ctx.fillStyle=g;ctx.fillRect(0,0,w,108);
  // 십자가 (흰색 도형)
  const cxw=w/2, cyc=26;
  ctx.fillStyle='#ffffff';
  ctx.fillRect(cxw-2.5,cyc-13,5,27);
  ctx.fillRect(cxw-9,cyc-5,18,5);
  // 제목
  ctx.fillStyle='#ffffff';ctx.font='800 28px "Noto Sans KR", sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillText('광주봉선교회 교구전도인 심방일정표',w/2,76);
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='600 15px "Noto Sans KR", sans-serif';
  ctx.fillText(Y+'년  '+M+'월',w/2,98);
}
function dayColor(wd){return wd===0?PAL.sun:wd===6?PAL.sat:PAL.ink}

function drawTable(){
  const last=new Date(Y,M,0).getDate();
  const w=920, padX=34, rowH=46, headH=120, colHeadH=44;
  const h=headH+colHeadH+rowH*last+74;
  const c=document.createElement('canvas');c.width=w*2;c.height=h*2;
  const x=c.getContext('2d');x.scale(2,2);
  drawHeader(x,w);

  const tableW=w-padX*2;
  const cols=[70,60,(tableW-130)/3,(tableW-130)/3,(tableW-130)/3];
  const labels=['날짜','요일','오전 · 10시','오후 · 2시','저녁 · 7시'];
  let y=headH+18;

  const g=x.createLinearGradient(padX,0,padX+tableW,0);
  g.addColorStop(0,PAL.sky);g.addColorStop(1,PAL.skyDeep);
  round(x,padX,y,tableW,colHeadH,12,g,null);
  x.fillStyle='#ffffff';x.font='700 15px "Noto Sans KR", sans-serif';x.textAlign='center';x.textBaseline='middle';
  let cx=padX;labels.forEach((l,i)=>{x.fillText(l,cx+cols[i]/2,y+colHeadH/2);cx+=cols[i]});
  y+=colHeadH+6;

  for(let d=1;d<=last;d++){
    const dk=dateKey(d), wd=new Date(Y,M-1,d).getDay();
    const hol=holiday(Y,M,d), isRed=(wd===0||hol);
    const weekend=(wd===0||wd===6);
    round(x,padX,y,tableW,rowH-4,10,(weekend||hol)?'#F6FAFE':PAL.card,PAL.line,1);
    cx=padX;
    const cy=y+(rowH-4)/2;
    x.fillStyle=isRed?PAL.sun:PAL.ink;x.textAlign='center';
    if(hol){
      x.textBaseline='alphabetic';x.font='700 15px "Noto Sans KR", sans-serif';x.fillText(d,cx+cols[0]/2,cy-1);
      x.font='700 9px "Noto Sans KR", sans-serif';x.fillText(hol,cx+cols[0]/2,cy+12);
    }else{
      x.textBaseline='middle';x.font='700 16px "Noto Sans KR", sans-serif';x.fillText(d,cx+cols[0]/2,cy);
    }
    cx+=cols[0];
    x.fillStyle=isRed?PAL.sun:dayColor(wd);x.textBaseline='middle';x.font='700 15px "Noto Sans KR", sans-serif';
    x.fillText(W[wd],cx+cols[1]/2,cy);cx+=cols[1];
    SLOTS.forEach((s,i)=>{
      const item=(data[dk]&&data[dk][s])||{state:'available',memo:''};
      const cw=cols[i+2];
      let bg,fg,bd=null,t;
      if(item.state==='confirmed'){bg=PAL.skySoft;fg=PAL.skyDeep;bd=PAL.skyLine;t='✓ '+(item.memo||'예약완료')}
      else if(item.state==='unavailable'){bg=PAL.coralSoft;fg=PAL.coral;bd=PAL.coralLine;t='× '+(item.memo||'불가능')}
      else {bg='transparent';fg='#AEB9C7';t='○ 가능'}
      if(bg!=='transparent')round(x,cx+10,y+7,cw-20,rowH-18,9,bg,bd,1);
      x.fillStyle=fg;x.font='700 14px "Noto Sans KR", sans-serif';
      x.fillText(clip(x,t,cw-26),cx+cw/2,y+(rowH-4)/2);
      cx+=cw;
    });
    y+=rowH;
  }
  x.fillStyle=PAL.muted;x.font='500 13px "Noto Sans KR", sans-serif';x.textAlign='center';x.textBaseline='alphabetic';
  x.fillText('작성일 '+new Date().toLocaleDateString('ko-KR')+'  ·  광주봉선교회',w/2,h-28);
  return c;
}
function clip(ctx,t,maxW){
  if(ctx.measureText(t).width<=maxW)return t;
  while(t.length>1&&ctx.measureText(t+'…').width>maxW)t=t.slice(0,-1);
  return t+'…';
}

function drawCalendar(){
  const first=new Date(Y,M-1,1).getDay(), last=new Date(Y,M,0).getDate(), weeks=Math.ceil((first+last)/7);
  const w=920, padX=30, headH=120;
  const gridW=w-padX*2, cellW=gridW/7, cellH=118, dowH=40;
  const top=headH+16;
  const h=top+dowH+weeks*cellH+74;
  const c=document.createElement('canvas');c.width=w*2;c.height=h*2;
  const x=c.getContext('2d');x.scale(2,2);
  drawHeader(x,w);

  let y=top;
  x.textAlign='center';x.textBaseline='middle';x.font='700 15px "Noto Sans KR", sans-serif';
  for(let i=0;i<7;i++){x.fillStyle=i===0?PAL.sun:i===6?PAL.sat:PAL.muted;x.fillText(W[i],padX+i*cellW+cellW/2,y+dowH/2)}
  y+=dowH;

  const names=['오전','오후','저녁'];
  for(let i=0;i<weeks*7;i++){
    const d=i-first+1, col=i%7, row=Math.floor(i/7);
    const px=padX+col*cellW, py=y+row*cellH;
    const inMonth=d>=1&&d<=last;
    round(x,px+4,py+4,cellW-8,cellH-8,14,inMonth?PAL.card:'#EDF2F8',PAL.line,1);
    if(!inMonth)continue;
    const dk=dateKey(d), wd=new Date(Y,M-1,d).getDay();
    const hol=holiday(Y,M,d), isRed=(wd===0||hol);
    x.fillStyle=isRed?PAL.sun:dayColor(wd);x.font='700 17px "Noto Sans KR", sans-serif';x.textAlign='left';x.textBaseline='alphabetic';
    x.fillText(d,px+15,py+32);
    if(hol){x.fillStyle=PAL.sun;x.font='700 11px "Noto Sans KR", sans-serif';x.textAlign='right';x.fillText(hol,px+cellW-16,py+30)}
    SLOTS.forEach((s,j)=>{
      const item=(data[dk]&&data[dk][s])||{state:'available',memo:''};
      const cy=py+42+j*23, cwInner=cellW-24;
      let bg,fg,bd=null,t;
      if(item.state==='confirmed'){bg=PAL.skySoft;fg=PAL.skyDeep;bd=PAL.skyLine;t=names[j]+' '+(item.memo||'예약')}
      else if(item.state==='unavailable'){bg=PAL.coralSoft;fg=PAL.coral;bd=PAL.coralLine;t=names[j]+' '+(item.memo||'불가')}
      else {bg='#F4F8FC';fg='#AEB9C7';t=names[j]+' 가능'}
      round(x,px+12,cy,cwInner,19,7,bg,bd,1);
      x.fillStyle=fg;x.font='700 11px "Noto Sans KR", sans-serif';x.textAlign='center';x.textBaseline='middle';
      x.fillText(clip(x,t,cwInner-8),px+12+cwInner/2,cy+10);
    });
  }
  x.fillStyle=PAL.muted;x.font='500 13px "Noto Sans KR", sans-serif';x.textAlign='center';x.textBaseline='alphabetic';
  x.fillText('작성일 '+new Date().toLocaleDateString('ko-KR')+'  ·  광주봉선교회',w/2,h-28);
  return c;
}

render();
</script>
