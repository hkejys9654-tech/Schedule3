<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>목사님 심방 일정표</title>
<meta name="theme-color" content="#1B1F2A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="심방일정">
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
–bg: #F4EFE6;
–surface: #FFFFFF;
–border: #E5DDD0;
–border-soft: #F0E9DD;
–ink: #1B1F2A;
–ink-muted: #6F6B62;
–available: #FFFFFF;
–unavailable: #B33A3A;
–confirmed: #3F6B4A;
–accent: #1B1F2A;
–weekend-sun: #B33A3A;
–weekend-sat: #2D5F8B;
}

html, body {
background: var(–bg);
color: var(–ink);
font-family: -apple-system, BlinkMacSystemFont, ‘Apple SD Gothic Neo’, ‘Malgun Gothic’, ‘Noto Sans KR’, sans-serif;
-webkit-font-smoothing: antialiased;
min-height: 100vh;
}

body {
max-width: 480px;
margin: 0 auto;
padding: 14px 12px 60px;
position: relative;
}

.serif {
font-family: ‘Apple SD Gothic Neo’, ‘Noto Sans KR’, ‘Malgun Gothic’, sans-serif;
letter-spacing: -0.02em;
font-weight: 800;
}

/* Header */
header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 6px 4px 14px;
border-bottom: 1px solid var(–border);
margin-bottom: 14px;
}
.brand {
font-size: 11px;
letter-spacing: 0.18em;
color: var(–ink-muted);
text-transform: uppercase;
font-weight: 600;
}
.export-btn {
background: var(–accent);
color: white;
border: none;
border-radius: 999px;
padding: 9px 14px;
font-size: 12px;
font-weight: 600;
cursor: pointer;
display: inline-flex;
align-items: center;
gap: 5px;
letter-spacing: 0.02em;
transition: transform 0.1s;
}
.export-btn:active { transform: scale(0.96); }

/* Title section */
.title-block {
text-align: center;
margin-bottom: 18px;
padding: 4px 0;
}
.title-main {
font-size: 26px;
font-weight: 800;
color: var(–ink);
margin-bottom: 4px;
letter-spacing: -0.02em;
}
.title-sub {
font-size: 12px;
color: var(–ink-muted);
letter-spacing: 0.05em;
}

/* Month nav */
.month-nav {
display: flex;
align-items: center;
justify-content: center;
gap: 14px;
margin-bottom: 16px;
}
.nav-btn {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 50%;
width: 38px;
height: 38px;
font-size: 16px;
cursor: pointer;
color: var(–ink);
display: inline-flex;
align-items: center;
justify-content: center;
transition: all 0.15s;
}
.nav-btn:active { transform: scale(0.92); background: var(–border-soft); }
.month-label {
font-size: 19px;
font-weight: 800;
min-width: 130px;
text-align: center;
letter-spacing: -0.01em;
}
.month-label .year {
font-size: 12px;
display: block;
font-weight: 500;
color: var(–ink-muted);
margin-bottom: 1px;
letter-spacing: 0.05em;
}

/* Legend */
.legend {
display: flex;
gap: 8px;
justify-content: center;
padding: 11px 14px;
margin-bottom: 12px;
font-size: 13px;
font-weight: 700;
}
.legend-item {
padding: 8px 14px;
border-radius: 999px;
font-weight: 700;
font-size: 13px;
}
.dot-available { background: #FFFFFF; color: #1B1F2A; border: 1.5px solid #C9C0AE; }
.dot-unavailable { background: #B33A3A; color: white; border: none; }
.dot-confirmed { background: #3F6B4A; color: white; border: none; }

/* Hint */
.hint {
text-align: center;
font-size: 11px;
color: var(–ink-muted);
margin-bottom: 10px;
letter-spacing: 0.02em;
}

/* Schedule */
#schedule-area {
background: var(–surface);
border-radius: 14px;
overflow: hidden;
box-shadow: 0 1px 2px rgba(0,0,0,0.03);
border: 1px solid var(–border-soft);
}

table {
width: 100%;
border-collapse: collapse;
font-size: 13px;
}
thead th {
background: #F9F5EC;
padding: 11px 4px 9px;
font-size: 11.5px;
font-weight: 700;
color: var(–ink);
border-bottom: 1.5px solid var(–border);
letter-spacing: 0.03em;
}
thead th .time {
display: block;
font-weight: 400;
font-size: 9.5px;
color: var(–ink-muted);
margin-top: 2px;
letter-spacing: 0.02em;
}
tbody tr {
border-bottom: 1px solid var(–border-soft);
}
tbody tr:last-child { border-bottom: none; }
td {
text-align: center;
vertical-align: middle;
padding: 0;
}
.date-cell {
font-weight: 700;
width: 64px;
padding: 8px 4px;
font-size: 13px;
font-variant-numeric: tabular-nums;
}
.day-cell {
width: 32px;
font-size: 12px;
font-weight: 600;
color: var(–ink-muted);
}
.day-cell.sunday { color: var(–weekend-sun); }
.day-cell.saturday { color: var(–weekend-sat); }

.slot-cell {
cursor: pointer;
height: 52px;
font-size: 12px;
font-weight: 600;
position: relative;
transition: filter 0.1s;
user-select: none;
}
.slot-cell:active { filter: brightness(0.94); }
.slot-cell.available { background: #FFFFFF; color: #C9C0AE; }
.slot-cell.unavailable { background: #B33A3A !important; color: white !important; }
.slot-cell.confirmed { background: #3F6B4A !important; color: white !important; padding: 4px 3px; }
.slot-icon {
font-size: 11px;
display: block;
line-height: 1.2;
font-weight: 700;
}
.slot-name {
display: block;
font-size: 11px;
font-weight: 500;
margin-top: 1px;
line-height: 1.2;
word-break: keep-all;
padding: 0 2px;
}

/* Modal / bottom sheet */
.modal-backdrop {
position: fixed;
top: 0; left: 0; right: 0; bottom: 0;
background: rgba(0,0,0,0.45);
display: none;
align-items: flex-end;
justify-content: center;
z-index: 100;
animation: fadeIn 0.15s ease-out;
}
.modal-backdrop.show { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
background: var(–surface);
width: 100%;
max-width: 480px;
border-radius: 18px 18px 0 0;
padding: 22px 20px calc(20px + env(safe-area-inset-bottom));
animation: slideUp 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle {
width: 36px;
height: 4px;
background: #D8D2C5;
border-radius: 2px;
margin: -8px auto 14px;
}
.modal-title {
font-size: 17px;
font-weight: 800;
margin-bottom: 5px;
text-align: center;
letter-spacing: -0.01em;
}
.modal-sub {
font-size: 12px;
color: var(–ink-muted);
text-align: center;
margin-bottom: 18px;
}
.state-buttons {
display: -webkit-box;
display: -webkit-flex;
display: flex;
-webkit-box-pack: justify;
justify-content: space-between;
margin-bottom: 16px;
}
.state-btn {
width: 31%;
padding: 18px 4px;
border-radius: 12px;
border: 2px solid #E5DDD0;
background: #F9F5EC;
font-size: 14px;
font-weight: 700;
cursor: pointer;
-webkit-transition: all 0.12s;
transition: all 0.12s;
color: #6F6B62;
font-family: inherit;
}
.state-btn:active { transform: scale(0.97); }
.state-btn.active[data-state=“available”] { background: #E8F4E8; border-color: #3F6B4A; color: #3F6B4A; }
.state-btn.active[data-state=“unavailable”] { background: #B33A3A; border-color: #B33A3A; color: white; font-size: 15px; }
.state-btn.active[data-state=“confirmed”] { background: #3F6B4A; border-color: #3F6B4A; color: white; font-size: 15px; }

.name-input-wrap {
margin-bottom: 16px;
max-height: 0;
overflow: hidden;
transition: max-height 0.2s;
}
.name-input-wrap.show { max-height: 100px; }
.name-input-wrap label {
display: block;
font-size: 12px;
margin-bottom: 6px;
color: var(–ink-muted);
font-weight: 600;
letter-spacing: 0.02em;
}
.name-input {
width: 100%;
padding: 13px 14px;
border: 1.5px solid var(–border);
border-radius: 10px;
font-size: 15px;
font-family: inherit;
background: #FAF7F0;
color: var(–ink);
}
.name-input:focus {
outline: none;
border-color: var(–accent);
background: white;
}

.modal-actions {
display: grid;
grid-template-columns: 1fr 2fr;
gap: 8px;
}
.btn-save, .btn-cancel {
padding: 15px;
border-radius: 12px;
border: none;
font-size: 15px;
font-weight: 700;
cursor: pointer;
font-family: inherit;
transition: transform 0.1s;
}
.btn-save { background: var(–accent); color: white; }
.btn-cancel { background: #F0E9DD; color: var(–ink); }
.btn-save:active, .btn-cancel:active { transform: scale(0.97); }

/* Toast */
.toast {
position: fixed;
bottom: 32px;
left: 50%;
transform: translateX(-50%) translateY(20px);
background: var(–ink);
color: white;
padding: 12px 22px;
border-radius: 999px;
font-size: 13px;
font-weight: 500;
opacity: 0;
transition: all 0.25s;
z-index: 9999;
box-shadow: 0 8px 24px rgba(0,0,0,0.2);
pointer-events: none;
}
.toast.show {
opacity: 1;
transform: translateX(-50%) translateY(0);
}

/* Footer */
.footer-note {
text-align: center;
font-size: 10.5px;
color: var(–ink-muted);
margin-top: 14px;
letter-spacing: 0.04em;
padding: 0 16px;
line-height: 1.5;
}

/* Export-only elements (hidden by default) */
.export-only { display: none; }

/* Image preview modal */
.img-modal {
position: fixed;
top: 0; left: 0; right: 0; bottom: 0;
background: rgba(0,0,0,0.88);
display: none;
flex-direction: column;
z-index: 300;
padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.img-modal.show { display: flex; }
.img-modal-header {
padding: 14px 16px 8px;
display: flex;
justify-content: flex-end;
align-items: center;
}
.img-modal-close {
background: rgba(255,255,255,0.18);
border: none;
color: white;
width: 36px;
height: 36px;
border-radius: 50%;
font-size: 18px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
}
.img-modal-hint {
padding: 0 16px 12px;
text-align: center;
color: white;
font-size: 14px;
font-weight: 600;
letter-spacing: -0.01em;
}
.img-modal-hint strong {
color: #FEE500;
font-weight: 800;
}
.img-modal-body {
flex: 1;
overflow: auto;
padding: 0 16px 16px;
display: flex;
align-items: flex-start;
justify-content: center;
}
.img-modal-body img {
max-width: 100%;
height: auto;
border-radius: 10px;
box-shadow: 0 8px 32px rgba(0,0,0,0.4);
display: block;
-webkit-user-select: auto;
user-select: auto;
-webkit-touch-callout: default;
}
.img-modal-actions {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
padding: 12px 16px 16px;
background: rgba(0,0,0,0.5);
}
.img-modal-actions button {
padding: 14px;
border: none;
border-radius: 12px;
font-size: 14px;
font-weight: 700;
cursor: pointer;
font-family: inherit;
transition: transform 0.1s;
}
.img-modal-actions button:active { transform: scale(0.96); }
.btn-share-img {
background: #FEE500;
color: #1B1F2A;
}
.btn-copy-img {
background: white;
color: #1B1F2A;
}

/* When exporting, show extras */
.exporting .export-only { display: block; }
.exporting .export-title {
padding: 18px 16px 14px;
text-align: center;
border-bottom: 1.5px solid var(–border);
background: #F9F5EC;
}
.exporting .export-title-main {
font-family: ‘Apple SD Gothic Neo’, ‘Noto Sans KR’, ‘Malgun Gothic’, sans-serif;
font-size: 20px;
font-weight: 800;
color: var(–ink);
margin-bottom: 3px;
letter-spacing: -0.02em;
}
.exporting .export-title-sub {
font-size: 11px;
color: var(–ink-muted);
letter-spacing: 0.04em;
}
.exporting .export-footer {
padding: 10px 12px;
text-align: right;
font-size: 9.5px;
color: var(–ink-muted);
background: #F9F5EC;
border-top: 1px solid var(–border-soft);
letter-spacing: 0.03em;
}
</style>

</head>
<body>

<header>
  <div class="brand">PASTOR · VISIT</div>
  <button class="export-btn" id="export-btn">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    이미지 저장
  </button>
</header>

<div class="title-block">
  <div class="title-main serif">목사님 심방 일정</div>
  <div class="title-sub">Pastoral Visit Schedule</div>
</div>

<div class="month-nav">
  <button class="nav-btn" id="prev-month" aria-label="이전 달">‹</button>
  <div class="month-label" id="month-label">
    <span class="year">2026</span>
    4월
  </div>
  <button class="nav-btn" id="next-month" aria-label="다음 달">›</button>
</div>

<div class="legend">
  <div class="legend-item dot-available">가능</div>
  <div class="legend-item dot-unavailable">불가능</div>
  <div class="legend-item dot-confirmed">심방확정</div>
</div>

<div class="hint">셀을 탭해서 상태를 변경할 수 있어요</div>

<div id="schedule-area">
  <div class="export-only export-title">
    <div class="export-title-main" id="export-title-main">목사님 심방 일정</div>
    <div class="export-title-sub" id="export-title-sub">2026년 4월</div>
  </div>
  <table>
    <thead>
      <tr>
        <th>날짜</th>
        <th>요일</th>
        <th>오전<span class="time">10–12</span></th>
        <th>오후<span class="time">14–17</span></th>
        <th>저녁<span class="time">19–22</span></th>
      </tr>
    </thead>
    <tbody id="schedule-body"></tbody>
  </table>
  <div class="export-only export-footer" id="export-footer-text">최종 업데이트: —</div>
</div>

<div class="footer-note">
  변경 즉시 자동 저장됩니다 · 이미지로 저장하여 카톡방에 공유하세요
</div>

<!-- Modal -->

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">날짜</div>
    <div class="modal-sub" id="modal-sub">시간대</div>
    <div class="state-buttons">
      <button class="state-btn" data-state="available">가능</button>
      <button class="state-btn" data-state="unavailable">불가</button>
      <button class="state-btn" data-state="confirmed">확정</button>
    </div>
    <div class="name-input-wrap" id="name-wrap">
      <label>심방 대상</label>
      <input type="text" class="name-input" id="name-input" placeholder="예: 김철수 형제님" maxlength="20">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btn-cancel">취소</button>
      <button class="btn-save" id="btn-save">저장</button>
    </div>
  </div>
</div>

<!-- Image preview modal -->

<div class="img-modal" id="img-modal">
  <div class="img-modal-header">
    <button class="img-modal-close" id="img-modal-close" aria-label="닫기">✕</button>
  </div>
  <div class="img-modal-hint">
    이미지를 <strong>꾹 누르면</strong> 사진 저장 / 카톡 공유 가능
  </div>
  <div class="img-modal-body">
    <img id="generated-img" alt="심방 일정표">
  </div>
  <div class="img-modal-actions">
    <button class="btn-copy-img" id="btn-copy-img">이미지 복사</button>
    <button class="btn-share-img" id="btn-share-img">공유하기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WEEKDAYS = ['일','월','화','수','목','금','토'];
let currentYear, currentMonth;
let scheduleData = {};
let editingCell = null;
let selectedState = 'available';

function init() {
  const now = new Date();
  currentYear = now.getFullYear();
  currentMonth = now.getMonth() + 1;
  
  document.getElementById('prev-month').addEventListener('click', () => changeMonth(-1));
  document.getElementById('next-month').addEventListener('click', () => changeMonth(1));
  document.getElementById('export-btn').addEventListener('click', exportImage);
  document.getElementById('btn-cancel').addEventListener('click', closeModal);
  document.getElementById('btn-save').addEventListener('click', saveCell);
  document.getElementById('modal-backdrop').addEventListener('click', (e) => {
    if (e.target.id === 'modal-backdrop') closeModal();
  });
  
  document.querySelectorAll('.state-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedState = btn.dataset.state;
      updateStateButtons();
      if (selectedState === 'confirmed') {
        setTimeout(() => document.getElementById('name-input').focus(), 200);
      }
    });
  });
  
  document.getElementById('img-modal-close').addEventListener('click', closeImgModal);
  document.getElementById('btn-share-img').addEventListener('click', shareImage);
  document.getElementById('btn-copy-img').addEventListener('click', copyImage);
  
  loadAndRender();
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth < 1) { currentMonth = 12; currentYear--; }
  if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  loadAndRender();
}

// Layered storage: window.storage → localStorage → memory
const memCache = {};
const Storage = {
  async get(key) {
    if (window.storage && typeof window.storage.get === 'function') {
      try {
        const result = await window.storage.get(key, false);
        if (result && result.value !== undefined) return result.value;
      } catch (e) { /* key may not exist; fall through */ }
    }
    try {
      if (typeof localStorage !== 'undefined') {
        const v = localStorage.getItem(key);
        if (v !== null) return v;
      }
    } catch (e) {}
    return memCache[key] || null;
  },
  async set(key, value) {
    memCache[key] = value;
    if (window.storage && typeof window.storage.set === 'function') {
      try {
        await window.storage.set(key, value, false);
      } catch (e) { console.warn('window.storage.set:', e.message); }
    }
    try {
      if (typeof localStorage !== 'undefined') {
        localStorage.setItem(key, value);
      }
    } catch (e) { console.warn('localStorage.set:', e.message); }
  }
};

async function loadAndRender() {
  const label = document.getElementById('month-label');
  label.innerHTML = `<span class="year">${currentYear}</span>${currentMonth}월`;
  document.getElementById('export-title-sub').textContent = `${currentYear}년 ${currentMonth}월`;
  
  try {
    const value = await Storage.get(storageKey());
    scheduleData = value ? JSON.parse(value) : {};
  } catch (err) {
    scheduleData = {};
  }
  renderTable();
}

function storageKey() {
  return `pastor-schedule-${currentYear}-${String(currentMonth).padStart(2,'0')}`;
}

async function saveData() {
  await Storage.set(storageKey(), JSON.stringify(scheduleData));
}

function renderTable() {
  const tbody = document.getElementById('schedule-body');
  tbody.innerHTML = '';
  const lastDay = new Date(currentYear, currentMonth, 0).getDate();
  
  for (let d = 1; d <= lastDay; d++) {
    const date = new Date(currentYear, currentMonth - 1, d);
    const wd = date.getDay();
    const dateKey = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayData = scheduleData[dateKey] || {};
    
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="date-cell">${currentMonth}월 ${String(d).padStart(2,'0')}일</td>
      <td class="day-cell ${wd===0?'sunday':wd===6?'saturday':''}">${WEEKDAYS[wd]}</td>
      ${renderSlot(dateKey, 'morning', dayData.morning, dayData.morningName)}
      ${renderSlot(dateKey, 'afternoon', dayData.afternoon, dayData.afternoonName)}
      ${renderSlot(dateKey, 'evening', dayData.evening, dayData.eveningName)}
    `;
    tbody.appendChild(tr);
  }
  
  tbody.querySelectorAll('.slot-cell').forEach(cell => {
    cell.addEventListener('click', () => openModal(cell.dataset.date, cell.dataset.slot));
  });
}

function renderSlot(date, slot, state, name) {
  state = state || 'available';
  let bg, color, inner;
  if (state === 'confirmed') {
    bg = '#3F6B4A'; color = 'white';
    inner = `<span class="slot-icon">✓</span><span class="slot-name">${name ? escapeHtml(name) : '확정'}</span>`;
  } else if (state === 'unavailable') {
    bg = '#B33A3A'; color = 'white';
    inner = `<span class="slot-icon">불가능</span>`;
  } else {
    bg = '#FFFFFF'; color = '#C9C0AE';
    inner = `<span class="slot-icon">가능</span>`;
  }
  return `<td class="slot-cell ${state}" data-date="${date}" data-slot="${slot}" style="background:${bg};color:${color};">${inner}</td>`;
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openModal(date, slot) {
  editingCell = { date, slot };
  const dayData = scheduleData[date] || {};
  selectedState = dayData[slot] || 'available';
  const nameKey = slot + 'Name';
  
  const [y,m,d] = date.split('-');
  const wd = new Date(parseInt(y), parseInt(m)-1, parseInt(d)).getDay();
  const slotLabel = slot === 'morning' ? '오전 (10–12시)' : slot === 'afternoon' ? '오후 (14–17시)' : '저녁 (19–22시)';
  
  document.getElementById('modal-title').textContent = `${parseInt(m)}월 ${parseInt(d)}일 (${WEEKDAYS[wd]})`;
  document.getElementById('modal-sub').textContent = slotLabel;
  document.getElementById('name-input').value = dayData[nameKey] || '';
  
  updateStateButtons();
  document.getElementById('modal-backdrop').classList.add('show');
}

function updateStateButtons() {
  const styles = {
    available:   { bg: '#E8F4E8', color: '#3F6B4A', border: '2px solid #3F6B4A' },
    unavailable: { bg: '#B33A3A', color: 'white',   border: '2px solid #B33A3A' },
    confirmed:   { bg: '#3F6B4A', color: 'white',   border: '2px solid #3F6B4A' },
  };
  const inactive = { bg: '#F9F5EC', color: '#6F6B62', border: '2px solid #E5DDD0' };

  document.querySelectorAll('.state-btn').forEach(btn => {
    const isActive = btn.dataset.state === selectedState;
    const s = isActive ? styles[btn.dataset.state] : inactive;
    btn.style.background    = s.bg;
    btn.style.color         = s.color;
    btn.style.border        = s.border;
    btn.style.fontWeight    = '700';
    btn.classList.toggle('active', isActive);
  });
  document.getElementById('name-wrap').classList.toggle('show', selectedState === 'confirmed');
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('show');
  editingCell = null;
}

async function saveCell() {
  if (!editingCell) return;
  const { date, slot } = editingCell;
  if (!scheduleData[date]) scheduleData[date] = {};
  scheduleData[date][slot] = selectedState;
  
  if (selectedState === 'confirmed') {
    const name = document.getElementById('name-input').value.trim();
    if (name) scheduleData[date][slot + 'Name'] = name;
    else delete scheduleData[date][slot + 'Name'];
  } else {
    delete scheduleData[date][slot + 'Name'];
  }
  
  // remove default available state to keep storage lean
  if (selectedState === 'available') {
    delete scheduleData[date][slot];
  }
  if (Object.keys(scheduleData[date]).length === 0) delete scheduleData[date];
  
  await saveData();
  renderTable();
  closeModal();
  showToast('저장됨');
}

let lastBlob = null;
let lastDataUrl = null;

async function exportImage() {
  const btn = document.getElementById('export-btn');
  btn.disabled = true;
  showToast('이미지 만드는 중...');
  
  const today = new Date();
  const stamp = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
  document.getElementById('export-footer-text').textContent = `최종 업데이트: ${stamp}`;
  
  document.body.classList.add('exporting');
  
  try {
    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }
    await new Promise(r => setTimeout(r, 120));
    
    const target = document.getElementById('schedule-area');
    const canvas = await html2canvas(target, {
      scale: 2,
      backgroundColor: '#ffffff',
      logging: false,
      useCORS: true,
      allowTaint: false,
      removeContainer: true
    });
    
    lastDataUrl = canvas.toDataURL('image/png');
    
    await new Promise((resolve) => {
      canvas.toBlob((blob) => {
        lastBlob = blob;
        resolve();
      }, 'image/png');
    });
    
    document.getElementById('generated-img').src = lastDataUrl;
    document.getElementById('img-modal').classList.add('show');
    showToast('완료! 이미지를 길게 누르세요');
  } catch (err) {
    console.error('Export error:', err);
    showToast('이미지 생성 실패: ' + (err.message || '알 수 없는 오류'));
  } finally {
    document.body.classList.remove('exporting');
    btn.disabled = false;
  }
}

function closeImgModal() {
  document.getElementById('img-modal').classList.remove('show');
}

async function shareImage() {
  if (!lastBlob) { showToast('이미지가 아직 준비 안 됐어요'); return; }
  
  const fileName = `심방일정_${currentYear}년${currentMonth}월.png`;
  
  try {
    const file = new File([lastBlob], fileName, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        title: '목사님 심방 일정',
        text: `${currentYear}년 ${currentMonth}월 심방 일정`
      });
      return;
    }
  } catch (e) {
    if (e.name === 'AbortError') return;
    console.warn('Share failed:', e);
  }
  
  showToast('공유 미지원 — 이미지를 꾹 눌러 저장하세요');
}

async function copyImage() {
  if (!lastBlob) { showToast('이미지가 아직 준비 안 됐어요'); return; }
  
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([
        new ClipboardItem({ 'image/png': lastBlob })
      ]);
      showToast('복사 완료! 카톡에 붙여넣기 하세요');
      return;
    }
  } catch (e) {
    console.warn('Clipboard failed:', e);
  }
  
  showToast('복사 미지원 — 이미지를 꾹 눌러 저장하세요');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 1700);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
